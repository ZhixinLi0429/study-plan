<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日任务">
<meta name="theme-color" content="#f6f5f2">
<title>今日任务</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1c;--muted:#8a877f;--line:#e8e6e1;--accent:#2d5a27;--soft:#e8f0e6;--red:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date{font-size:24px;font-weight:700}
.wd{font-size:14px;color:var(--muted);margin-left:6px;font-weight:400}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px;color:var(--ink)}
.count{display:flex;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.count span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.count b{color:var(--red)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:46px;text-align:center;border-radius:12px;padding:5px 0 6px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip .n{font-size:16px;color:var(--ink);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.chip.part .dot{background:#d9b44a}.chip.done .dot{background:var(--accent)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}.chip.sel .n{color:#fff}
.chip.today:not(.sel){border-color:var(--accent)}
.chip.exam .n{color:var(--red)}.chip.sel.exam .n{color:#fff}
main{padding:4px 16px 40px}
.tag{font-size:14px;color:var(--muted);margin:2px 0 10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 0 14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sec h3{margin:0;font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--accent)}
.sec h3 small{color:var(--muted);font-weight:400}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.task:last-child{border-bottom:0}
.box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid #c9c6bf;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.task.on .box{background:var(--accent);border-color:var(--accent)}
.task.on .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.txt{flex:1}
.task.on .txt{text-decoration:line-through;color:#aaa69d}
.time{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:4px}
summary{font-size:14px;font-weight:600;cursor:pointer}
details p{white-space:pre-wrap;font-size:14px;color:#444;margin:8px 0 0}
.foot{display:flex;gap:8px;justify-content:center;margin-top:18px}
.foot button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.cheer{text-align:center;color:var(--accent);font-weight:600;margin:4px 0 12px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="date" id="date"></div>
    <div class="nav"><button id="prev">‹</button> <button id="today">今天</button> <button id="next">›</button></div>
  </div>
  <div class="count" id="count"></div>
</header>
<div class="strip" id="strip"></div>
<main>
  <div class="tag" id="tag"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="prog"><span id="progtxt"></span><span id="remain"></span></div>
  <div id="cheer" class="cheer" hidden>今天全部完成 🎉</div>
  <div id="list"></div>
  <details id="week"><summary id="wtitle"></summary><p id="wbody"></p></details>
  <div class="foot"><button id="export">备份进度</button><button id="import">恢复进度</button></div>
</main>

1-21": {"label": "11.21", "tag": "", "sections": []}, "2026-11-22": {"label": "11.22", "tag": "", "sections": []}, "2026-11-23": {"label": "11.23", "tag": "", "sections": []}, "2026-11-24": {"label": "11.24", "tag": "", "sections": []}, "2026-11-25": {"label": "11.25", "tag": "", "sections": []}, "2026-11-26": {"label": "11.26", "tag": "", "sections": []}, "2026-11-27": {"label": "11.27", "tag": "", "sections": []}, "2026-11-28": {"label": "11.28", "tag": "", "sections": []}, "2026-11-29": {"label": "11.29", "tag": "", "sections": []}, "2026-11-30": {"label": "11.30", "tag": "", "sections": []}, "2026-12-01": {"label": "12.1", "tag": "", "sections": []}, "2026-12-02": {"label": "12.2", "tag": "", "sections": []}, "2026-12-03": {"label": "12.3", "tag": "", "sections": []}, "2026-12-04": {"label": "12.4", "tag": "", "sections": []}, "2026-12-05": {"label": "12.5", "tag": "", "sections": []}, "2026-12-06": {"label": "12.6", "tag": "", "sections": []}}, "weeks": [{"title": "周计划：托福按 6/6/6/10/10/1 推进，GRE 10.13 正式开始。", "body": "托福（从 10.13 开始）：Discussion 第1–36题，Email 第1–36题，造句 M1–36，填词 第1–60篇，Repeat 第一遍 M1–60，Interview G1–6。\nGRE（第一遍）：数学 30 组、语文 24 组。每天先做 GRE 还是托福自己定，按格子里的任务和时长走。\n单词：以题带词，做题时☆生词，睡前过一遍（见「单词方法」页）。", "dates": ["2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17", "2026-10-18"]}, {"title": "周计划：托福收尾，10.25 考试；GRE 第一遍过半。", "body": "托福：Repeat 10.19 第一遍完；Discussion 10.23 完；Email、造句、填词、Interview、Repeat 第二遍 10.24 完。10.22–10.24 Interview 每天 2 组，10.22/10.23 比较满。10.24 留 1h 把背过的写作/口语再过一遍。\nGRE：数学 27 组、语文 22 组；10.24 减量、早睡；10.25 不排 GRE。", "dates": ["2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25"]}, {"title": "周计划：GRE 全天。10.28 第一遍完成，10.29 开始第二遍。", "body": "第一遍做慢做透：每题看解析，选项词不认识就☆。\n第二遍限时做快，重点盯第一遍☆的题；每天留 45min 复盘错题。", "dates": ["2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30", "2026-10-31", "2026-11-01"]}, {"title": "周计划：GRE 第二遍 11.4 完成，11.6 考试。", "body": "11.5 只看收藏错题和☆生词，不开新题。\n考后：送分、其他事项（自行安排）。", "dates": ["2026-11-02", "2026-11-03", "2026-11-04", "2026-11-05", "2026-11-06", "2026-11-07", "2026-11-08"]}, {"title": "周计划：", "body": "", "dates": ["2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13", "2026-11-14", "2026-11-15"]}, {"title": "周计划：", "body": "", "dates": ["2026-11-16", "2026-11-17", "2026-11-18", "2026-11-19", "2026-11-20", "2026-11-21", "2026-11-22"]}, {"title": "周计划：", "body": "", "dates": ["2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27", "2026-11-28", "2026-11-29"]}, {"title": "周计划：", "body": "", "dates": ["2026-11-30", "2026-12-01", "2026-12-02", "2026-12-03", "2026-12-04", "2026-12-05", "2026-12-06"]}]};
const KEY = 'plan_checks_v1';
const EXAMS = {'2026-10-25': '托福', '2026-11-06': 'GRE'};
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
const DATES = Object.keys(DATA.days).sort();
let checks = {};
try { checks = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => localStorage.setItem(KEY, JSON.stringify(checks));
const $ = id => document.getElementById(id);

const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayIso = () => iso(new Date());
const clamp = s => s < DATES[0] ? DATES[0] : s > DATES[DATES.length - 1] ? DATES[DATES.length - 1] : s;
let cur = clamp(todayIso());

const tid = (date, sec, text) => date + '|' + sec + '|' + text;
// tasks that are notes, not to-dos
const isNote = t => /^（.*）$/.test(t) || t === '不安排' || t === '休息';
function tasksOf(date) {
  const day = DATA.days[date]; const out = [];
  if (!day) return out;
  day.sections.forEach(s => s.tasks.forEach(t => { if (!isNote(t)) out.push(tid(date, s.name, t)); }));
  return out;
}
function stat(date) {
  const ts = tasksOf(date); const done = ts.filter(k => checks[k]).length;
  return {total: ts.length, done};
}
function mins(text) {
  const m = text.match(/（(?:(\d+)h)?(\d+)?(?:min)?）\s*$/);
  if (!m || (!m[1] && !m[2])) return 0;
  return (+(m[1] || 0)) * 60 + (+(m[2] || 0));
}
const fmt = n => n >= 60 ? Math.floor(n / 60) + 'h' + (n % 60 ? String(n % 60).padStart(2, '0') : '') : n + 'min';

function renderStrip() {
  const s = $('strip'); s.innerHTML = '';
  const t = todayIso();
  DATES.forEach(d => {
    const st = stat(d); const dt = parse(d);
    const c = document.createElement('div');
    c.className = 'chip' + (d === cur ? ' sel' : '') + (d === t ? ' today' : '') + (EXAMS[d] ? ' exam' : '')
      + (st.total && st.done === st.total ? ' done' : st.done ? ' part' : '');
    c.innerHTML = `<div>${dt.getMonth() + 1}月</div><div class="n">${dt.getDate()}</div><div class="dot"></div>`;
    c.onclick = () => { cur = d; render(); };
    s.appendChild(c);
    if (d === cur) setTimeout(() => c.scrollIntoView({inline: 'center', block: 'nearest'}), 0);
  });
}

function render() {
  const day = DATA.days[cur]; const dt = parse(cur);
  $('date').innerHTML = `${dt.getMonth() + 1}月${dt.getDate()}日<span class="wd">${WD[dt.getDay()]}${cur === todayIso() ? ' · 今天' : ''}</span>`;
  const now = parse(todayIso());
  $('count').innerHTML = Object.entries(EXAMS).map(([d, n]) => {
    const k = Math.round((parse(d) - now) / 864e5);
    return k > 0 ? `<span>距${n} <b>${k}</b> 天</span>` : k === 0 ? `<span><b>今天${n}考试，加油！</b></span>` : '';
  }).join('');
  $('tag').textContent = day && day.tag ? day.tag : '';
  const list = $('list'); list.innerHTML = '';
  let left = 0;
  if (!day || !day.sections.length) {
    list.innerHTML = '<div class="empty">这天还没有安排</div>';
  } else {
    day.sections.forEach(s => {
      const sec = document.createElement('div'); sec.className = 'sec';
      const real = s.tasks.filter(t => !isNote(t));
      const n = real.filter(t => checks[tid(cur, s.name, t)]).length;
      sec.innerHTML = `<h3>${s.name}<small>${real.length ? n + '/' + real.length : ''}</small></h3>`;
      s.tasks.forEach(t => {
        const row = document.createElement('div');
        if (isNote(t)) {
          row.className = 'task'; row.style.cursor = 'default';
          row.innerHTML = `<div class="txt time">${t}</div>`;
        } else {
          const k = tid(cur, s.name, t); const on = !!checks[k];
          if (!on) left += mins(t);
          row.className = 'task' + (on ? ' on' : '');
          const m = t.match(/^(.*?)(（[^（）]*）)?\s*$/);
          row.innerHTML = `<div class="box"></div><div class="txt">${m[1]}${m[2] ? ' <span class="time">' + m[2] + '</span>' : ''}</div>`;
          row.onclick = () => {
            if (checks[k]) delete checks[k]; else checks[k] = Date.now();
            save(); render();
          };
        }
        sec.appendChild(row);
      });
      list.appendChild(sec);
    });
  }
  const st = stat(cur);
  $('bar').style.width = st.total ? (st.done / st.total * 100) + '%' : '0';
  $('progtxt').textContent = st.total ? `完成 ${st.done}/${st.total}` : '';
  $('remain').textContent = left ? `剩余约 ${fmt(left)}` : '';
  $('cheer').hidden = !(st.total && st.done === st.total);
  const wk = DATA.weeks.find(w => w.dates.includes(cur));
  $('week').hidden = !wk || !(wk.title.replace('周计划：', '') || wk.body);
  if (wk) { $('wtitle').textContent = wk.title || '周计划'; $('wbody').textContent = wk.body; }
  renderStrip();
}

const step = n => { const i = DATES.indexOf(cur) + n; if (i >= 0 && i < DATES.length) { cur = DATES[i]; render(); } };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('today').onclick = () => { cur = clamp(todayIso()); render(); };
let x0 = null;
document.querySelector('main').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
document.querySelector('main').addEventListener('touchend', e => {
  if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 70) step(dx < 0 ? 1 : -1);
});
$('export').onclick = async () => {
  const s = JSON.stringify(checks);
  try { await navigator.clipboard.writeText(s); alert('进度已复制到剪贴板，粘贴到备忘录里保存即可。'); }
  catch (e) { prompt('复制下面的内容保存：', s); }
};
$('import').onclick = () => {
  const s = prompt('粘贴之前备份的进度：');
  if (!s) return;
  try { checks = JSON.parse(s); save(); render(); alert('已恢复'); } catch (e) { alert('格式不对，没有恢复'); }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
render();
</script>
